name: Codex Review Gate

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  codex-review-request:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@codex review')
    name: Codex Review Request
    runs-on: ubuntu-latest
    steps:
      - name: Mark the PR head as awaiting Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" -f state=pending -f context='Codex Review Ready' -f description='A current-head Codex review was requested.'

  codex-review-gate:
    if: github.event_name != 'issue_comment'
    name: Codex Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Require current Codex review and zero unresolved Codex threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --test .github/scripts/codex-review-gate.test.mjs
          node .github/scripts/codex-review-gate.mjs
      - name: Mark current-head Codex review ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" -f state=success -f context='Codex Review Ready' -f description='Current-head Codex review completed with no unresolved Codex threads.'
